<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Butterfly frames — flap player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3efe2; }
    #scene { position: fixed; inset: 0; display: block; }
    #hud {
      position: fixed; left: 14px; top: 12px; z-index: 10;
      font-family: "Courier New", monospace; font-size: 12px; line-height: 1.55;
      color: rgba(35, 68, 141, 0.85); white-space: pre; pointer-events: none;
      background: rgba(243, 239, 226, 0.62); padding: 9px 11px; border-radius: 6px;
    }
    #hud b { color: #e74e4d; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud">loading…</div>
  <script type="module" src="./js/splat/frames.js"></script>
</body>
</html>
